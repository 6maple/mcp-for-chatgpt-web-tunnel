name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_GIT_HOOKS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Initialize Brain and install dependencies
        run: node scripts/init-brain.mjs

      - name: Vite Plus quality check
        run: vp check

      - name: Workspace checks
        run: vp run check

      - name: Build
        run: vp run build
